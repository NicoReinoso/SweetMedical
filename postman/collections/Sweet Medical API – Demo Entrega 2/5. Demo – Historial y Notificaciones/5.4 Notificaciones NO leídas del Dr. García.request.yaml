$kind: http-request
description: El médico recibió notificaciones cuando Juan canceló su turno. Captura el ID de la primera notificación.
url: "{{baseUrl}}/notificaciones/{{medicoId1}}/no-leidas"
method: GET
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200) {
        const notifs = pm.response.json();
        if (Array.isArray(notifs) && notifs.length > 0) {
          pm.collectionVariables.set('notificacionId', notifs[0]._id);
          console.log('notificacionId =', notifs[0]._id);
        }
      }
    language: text/javascript
order: 4000
