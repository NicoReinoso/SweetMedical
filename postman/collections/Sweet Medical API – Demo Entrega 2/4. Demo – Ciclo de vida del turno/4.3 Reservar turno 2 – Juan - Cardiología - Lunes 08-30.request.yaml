$kind: http-request
name: 4.3 Reservar turno 2 – Juan / Cardiología / Lunes 08:30
description: 2026-07-06T11:30Z = 08:30 UTC-3. Slot disponible dentro del bloque LUNES 08:00–12:00.
url: "{{baseUrl}}/turnos"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "medicoId": "{{medicoId1}}",
      "pacienteId": "{{pacienteId1}}",
      "fechaHora": "2026-07-06T11:30:00.000Z",
      "sede": "Medrano",
      "especialidad": "Cardiología",
      "costo": 1100
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 201) {
        pm.collectionVariables.set('turnoId2', pm.response.json()._id);
        console.log('turnoId2 =', pm.response.json()._id);
      }
    language: text/javascript
order: 3000
